name: Build PH PVE Survival HUD v1.4.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-survivalhud-v10.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Materialize Survival HUD v1.4.0 source
        shell: pwsh
        run: |
          $b64 = ''
          [IO.File]::WriteAllBytes("PHPVESurvivalHUD-Source-v1.4.0.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -LiteralPath "PHPVESurvivalHUD-Source-v1.4.0.zip" -DestinationPath "hudsrc" -Force
          Get-ChildItem -Recurse hudsrc | Select-Object FullName

      - name: Restore
        shell: pwsh
        run: dotnet restore "hudsrc/PHPVESurvivalHUD/PHPVESurvivalHUD.csproj"

      - name: Build
        shell: pwsh
        run: dotnet build "hudsrc/PHPVESurvivalHUD/PHPVESurvivalHUD.csproj" -c Release --no-restore

      - name: Stage deploy package
        shell: pwsh
        run: |
          $stage = "stage/Rocket/Plugins"
          New-Item -ItemType Directory -Force -Path "$stage/PHPVESurvivalHUD" | Out-Null
          Copy-Item "hudsrc/PHPVESurvivalHUD/bin/Release/netstandard2.1/PHPVESurvivalHUD.dll" "$stage/PHPVESurvivalHUD.dll" -Force
          Copy-Item "hudsrc/PHPVESurvivalHUD/deploy/Rocket/Plugins/PHPVESurvivalHUD/PHPVESurvivalHUD.configuration.xml" "$stage/PHPVESurvivalHUD/PHPVESurvivalHUD.configuration.xml" -Force
          Get-FileHash "$stage/PHPVESurvivalHUD.dll" -Algorithm SHA256
          Get-ChildItem -Recurse stage | Select-Object FullName,Length

      - uses: actions/upload-artifact@v4
        with:
          name: PHPVESurvivalHUD-v1.4.0
          path: stage
          if-no-files-found: error
