name: Build PH PVE Survival HUD Client v1.1.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-survivalhud-client-v2.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Materialize client module source
        shell: pwsh
        run: |
          $b64 = ''
          [IO.File]::WriteAllBytes("PHPVESurvivalHUDClient-Source-v1.1.0.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -LiteralPath "PHPVESurvivalHUDClient-Source-v1.1.0.zip" -DestinationPath "clientsrc" -Force
          Get-ChildItem -Recurse clientsrc | Select-Object FullName

      - name: Restore
        shell: pwsh
        run: dotnet restore "clientsrc/PHPVESurvivalHUDClient/PHPVESurvivalHUDClient.csproj"

      - name: Build
        shell: pwsh
        run: dotnet build "clientsrc/PHPVESurvivalHUDClient/PHPVESurvivalHUDClient.csproj" -c Release --no-restore

      - name: Stage client module
        shell: pwsh
        run: |
          $stage = "stage/Modules/PHPVESurvivalHUDClient"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "clientsrc/PHPVESurvivalHUDClient/bin/Release/netstandard2.1/PHPVESurvivalHUDClient.dll" "$stage/PHPVESurvivalHUDClient.dll" -Force
          Copy-Item "clientsrc/PHPVESurvivalHUDClient/PHPVESurvivalHUDClient.module" "$stage/PHPVESurvivalHUDClient.module" -Force
          Get-FileHash "$stage/PHPVESurvivalHUDClient.dll" -Algorithm SHA256
          Get-ChildItem -Recurse stage | Select-Object FullName,Length

      - uses: actions/upload-artifact@v4
        with:
          name: PHPVESurvivalHUDClient-v1.1.0
          path: stage
          if-no-files-found: error
