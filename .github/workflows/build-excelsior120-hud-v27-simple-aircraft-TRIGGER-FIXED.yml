name: Build Excelsior120 HUD v1.20.0 SIMPLE-AIRCRAFT FIXED

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Materialize source
        shell: pwsh
        run: |
          $b64 = ''
          [IO.File]::WriteAllBytes("Excelsior120-HUD-Source-v1.20.0-SIMPLE-AIRCRAFT.zip", [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash "Excelsior120-HUD-Source-v1.20.0-SIMPLE-AIRCRAFT.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "c032965e9aef0cca5ea78e26210a692ee3a26df0eeeb052661a5497cb8744859"
          if ($actual -ne $expected) { throw "Embedded source ZIP hash mismatch: $actual != $expected" }
          Expand-Archive -LiteralPath "Excelsior120-HUD-Source-v1.20.0-SIMPLE-AIRCRAFT.zip" -DestinationPath "hudsrc" -Force
      - name: Restore
        shell: pwsh
        run: dotnet restore "hudsrc/PHPVESurvivalHUD/PHPVESurvivalHUD.csproj"
      - name: Build
        shell: pwsh
        run: dotnet build "hudsrc/PHPVESurvivalHUD/PHPVESurvivalHUD.csproj" -c Release --no-restore
      - name: Stage deploy package
        shell: pwsh
        run: |
          $stage = "stage/Rocket/Plugins"
          New-Item -ItemType Directory -Force -Path "$stage/PHPVESurvivalHUD" | Out-Null
          Copy-Item "hudsrc/PHPVESurvivalHUD/bin/Release/netstandard2.1/PHPVESurvivalHUD.dll" "$stage/PHPVESurvivalHUD.dll" -Force
          Copy-Item "hudsrc/PHPVESurvivalHUD/deploy/Rocket/Plugins/PHPVESurvivalHUD/PHPVESurvivalHUD.configuration.xml" "$stage/PHPVESurvivalHUD/PHPVESurvivalHUD.configuration.xml" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Excelsior120-HUD-v1.20.0-SIMPLE-AIRCRAFT
          path: stage
          if-no-files-found: error
