name: Build PH PVE Essential Plugins

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'PHAdditions.cs'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch latest ShimmysAdminTools source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ShimmyMySherbet/ShimmysAdminTools.git upstream
          if ($LASTEXITCODE -ne 0) { throw 'Failed to clone ShimmysAdminTools.' }

      - name: Patch source for PH PVE all-in-one plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projectDir = Join-Path $PWD 'upstream\ShimmysAdminTools'

          # Make the existing configuration extensible by PHAdditions.cs.
          $configPath = Join-Path $projectDir 'Models\PluginConfig.cs'
          $cfg = (Get-Content $configPath -Raw).Replace("`r`n", "`n")
          $cfg = $cfg.Replace(
            'public class PluginConfig : IRocketPluginConfiguration',
            'public partial class PluginConfig : IRocketPluginConfiguration')
          Set-Content -Path $configPath -Value $cfg -Encoding UTF8

          # Initialize/shutdown PH systems inside the single existing Rocket plugin type.
          $mainPath = Join-Path $projectDir 'AdminToolsPlugin.cs'
          $src = (Get-Content $mainPath -Raw).Replace("`r`n", "`n")
          if (-not $src.Contains('PHCore.Initialize(this);')) {
            $src = $src.Replace(
              '            Config = Configuration.Instance;',
              "            Config = Configuration.Instance;`n            PHCore.Initialize(this);")
          }
          if (-not $src.Contains('PHCore.Shutdown();')) {
            $src = $src.Replace(
              "        public override void UnloadPlugin(PluginState state = PluginState.Unloaded)`n        {",
              "        public override void UnloadPlugin(PluginState state = PluginState.Unloaded)`n        {`n            PHCore.Shutdown();")
          }

          # Rebrand console messages and disable the old plugin updater check.
          $src = $src.Replace(
            '            Logger.Log($"Loading ShimmysAdminTools v{UpdaterCore.CurrentVersion} by ShimmyMySherbet");',
            '            Logger.Log("Loading PH PVE Essential Plugins");')
          $src = $src.Replace('            Logger.Log("Checking for updates...");', '            // PH PVE build: upstream update check intentionally disabled.')
          $src = $src.Replace('            UpdaterCore.Init();', '            // UpdaterCore.Init();')
          $src = $src.Replace('            Logger.Log("ShimmysAdminTools loaded.");', '            Logger.Log("PH PVE Essential Plugins loaded.");')

          # Add editable PH PVE messages to Rocket's generated translation XML.
          $translationNeedle = "        public override TranslationList DefaultTranslations => new TranslationList()`n        {`n"
          $translationEntries = @'
            { "PH_NoPermission", "You do not have permission to use this." },
            { "PH_EagleEye", "{0} has activated the Eagle Eye Surveillance System" },
            { "PH_EditorOwnBarricades", "You can only move your own barricades!" },
            { "PH_EditorOwnStructures", "You can only move your own structures!" },
            { "PH_Back_NoLocation", "No previous location is available." },
            { "PH_Back_Cooldown", "You must wait {0} before using /back again." },
            { "PH_Back_Returned", "Returned to your previous location." },
            { "PH_Tpa_PlayerNotFound", "Player not found." },
            { "PH_Tpa_Sent", "Teleport request sent to {0}." },
            { "PH_Tpa_Received", "{0} wants to teleport to you. Use /tpaccept or /tpdeny." },
            { "PH_Tpa_NoPending", "You have no pending teleport request." },
            { "PH_Tpa_Expired", "That teleport request has expired." },
            { "PH_Tpa_Denied_Target", "Denied {0}'s teleport request." },
            { "PH_Tpa_Denied_Requester", "{0} denied your teleport request." },
            { "PH_Tpa_Accepted_Target", "Accepted {0}'s teleport request." },
            { "PH_Tpa_Accepted_Requester", "{0} accepted your teleport request." },
            { "PH_PlayerNotFound", "Player not found." },
            { "PH_Tell_PlayerNotFound", "Player not found." },
            { "PH_Tell_To", "To {0}: {1}" },
            { "PH_Tell_From", "From {0}: {1}" },
            { "PH_Reply_NoTarget", "There is nobody available to reply to." },
            { "PH_Freeze_Frozen", "Froze {0}." },
            { "PH_Freeze_YouFrozen", "You have been frozen." },
            { "PH_Freeze_Unfrozen", "Unfroze {0}." },
            { "PH_Freeze_YouUnfrozen", "You have been unfrozen." },
            { "PH_Repair_Done", "All inventory items repaired." },
            { "PH_Sudo_Done", "Executed command as {0}." },
            { "PH_Sudo_Failed", "Could not execute the command as {0}." },
            { "PH_Cuff_Done", "Cuffed {0}." },
            { "PH_Cuff_Target", "You have been cuffed." },
            { "PH_Uncuff_Done", "Uncuffed {0}." },
            { "PH_Uncuff_Target", "You have been uncuffed." },
          '@
          if (-not $src.Contains('{ "PH_NoPermission"')) {
            if (-not $src.Contains($translationNeedle)) { throw 'Could not find Shimmys translation initializer.' }
            $src = $src.Replace($translationNeedle, $translationNeedle + $translationEntries.Replace("`r`n", "`n"))
          }
          Set-Content -Path $mainPath -Value $src -Encoding UTF8

          # Copy PH PVE additions into the same assembly.
          Copy-Item (Join-Path $PWD 'PHAdditions.cs') (Join-Path $projectDir 'PHAdditions.cs') -Force

          # SDK-style project compiled against the current RocketModFix/Unturned redists.
          $csproj = @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net48</TargetFramework>
              <AssemblyName>PHPVEEssentialPlugins</AssemblyName>
              <RootNamespace>ShimmysAdminTools</RootNamespace>
              <GenerateAssemblyInfo>false</GenerateAssemblyInfo>
              <LangVersion>latest</LangVersion>
              <Nullable>disable</Nullable>
              <ImplicitUsings>disable</ImplicitUsings>
              <Deterministic>true</Deterministic>
              <DebugType>portable</DebugType>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.NETFramework.ReferenceAssemblies.net48" Version="1.0.3" PrivateAssets="all" />
              <PackageReference Include="RocketModFix.Rocket.API" Version="4.23.1" />
              <PackageReference Include="RocketModFix.Rocket.Core" Version="4.23.1" />
              <PackageReference Include="RocketModFix.Rocket.Unturned" Version="4.23.1" />
              <PackageReference Include="RocketModFix.UnityEngine.Redist" Version="2022.3.62.3" />
              <PackageReference Include="RocketModFix.Unturned.Redist.Client" Version="3.26.3.4" />
            </ItemGroup>
          </Project>
          '@
          Set-Content -Path (Join-Path $projectDir 'PHPVEEssentialPlugins.Build.csproj') -Value $csproj -Encoding UTF8

      - name: Restore
        shell: pwsh
        working-directory: upstream/ShimmysAdminTools
        run: dotnet restore PHPVEEssentialPlugins.Build.csproj

      - name: Compile PHPVEEssentialPlugins.dll
        shell: pwsh
        working-directory: upstream/ShimmysAdminTools
        run: dotnet build PHPVEEssentialPlugins.Build.csproj --configuration Release --no-restore

      - name: Stage plugin package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $dll = Get-ChildItem -Path upstream\ShimmysAdminTools\bin\Release -Recurse -Filter PHPVEEssentialPlugins.dll | Select-Object -First 1
          if ($null -eq $dll) { throw 'PHPVEEssentialPlugins.dll was not produced.' }
          Copy-Item $dll.FullName artifact\PHPVEEssentialPlugins.dll
          @'
          PH PVE Essential Plugins - permission additions
          
          DEFAULT (all players):
          <Permission Cooldown="0">phpve.tpa.respond</Permission>
          
          CEO:
          <Permission Cooldown="0">phpve.tpa.send</Permission>
          <Permission Cooldown="0">phpve.eagleeye.announce</Permission>
          <Permission Cooldown="0">admin.freecam</Permission>
          <Permission Cooldown="0">admin.editor</Permission>
          <Permission Cooldown="0">admin.spectate</Permission>
          <Permission Cooldown="0">phpve.command.back</Permission>
          
          ELITE:
          <Permission Cooldown="0">phpve.eagleeye.announce</Permission>
          <Permission Cooldown="0">admin.freecam</Permission>
          <Permission Cooldown="0">admin.editor</Permission>
          <Permission Cooldown="0">admin.spectate</Permission>
          
          MODERS:
          <Permission Cooldown="0">admin.freecam</Permission>
          <Permission Cooldown="0">admin.editor</Permission>
          <Permission Cooldown="0">admin.spectate</Permission>
          
          STAFF / cleanup:
          <Permission Cooldown="0">admin.freecam</Permission>
          <Permission Cooldown="0">admin.editor</Permission>
          <Permission Cooldown="0">admin.spectate</Permission>
          <Permission Cooldown="0">admin.editor.otherobjects</Permission>
          
          /back cooldown is enforced internally by the plugin at 3600 seconds after a SUCCESSFUL /back.
          Do not put Rocket Cooldown="3600" on phpve.command.back.
          '@ | Set-Content artifact\PHPVE-Permissions.txt -Encoding UTF8
          Copy-Item PHAdditions.cs artifact\PHAdditions.source.cs

      - name: Upload compiled plugin
        uses: actions/upload-artifact@v4
        with:
          name: PH-PVE-Essential-Plugins
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
