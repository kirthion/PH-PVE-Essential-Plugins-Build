      - name: Validate explosive and bed editor movement lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Get-Content PHAdditions.cs -Raw
          $required = @(
            'IsEditorMovementHardBlocked',
            'asset.build == EBuild.BED',
            'drop.interactable is InteractableBed',
            'asset is ItemChargeAsset',
            'asset.build == EBuild.CHARGE',
            'trapAsset.isExplosive',
            'PH_EditorExplosiveLocked'
          )
          foreach ($term in $required) {
            if (-not $src.Contains($term)) { throw "Missing explosive editor lock guard: $term" }
          }
          Write-Host 'Explosive/charge + bed Admin Editor movement lock validated.'

      - name: Fetch pinned source trees
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $uEssentialsCommit = '7865c393a4563558d1a02a3cb2384885af4217e6'
          $shimmysCommit = '85a142f5742626e62c60f1717d3c76ef3b54c040'

          git init uess
          git -C uess remote add origin https://github.com/TH3AL3X/uEssentials.git
          git -C uess fetch --depth 1 origin $uEssentialsCommit
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch pinned uEssentials source.' }
          git -C uess checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Failed to checkout pinned uEssentials source.' }

          git init shimmy
          git -C shimmy remote add origin https://github.com/ShimmyMySherbet/ShimmysAdminTools.git
          git -C shimmy fetch --depth 1 origin $shimmysCommit
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch pinned ShimmysAdminTools source.' }
          git -C shimmy checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Failed to checkout pinned ShimmysAdminTools source.' }

          $actualU = (git -C uess rev-parse HEAD).Trim()
          $actualS = (git -C shimmy rev-parse HEAD).Trim()
          if ($actualU -ne $uEssentialsCommit) { throw "uEssentials commit mismatch: $actualU" }
          if ($actualS -ne $shimmysCommit) { throw "ShimmysAdminTools commit mismatch: $actualS" }

          Write-Host "Pinned uEssentials: $actualU"
          Write-Host "Pinned ShimmysAdminTools: $actualS"

      - name: Merge and patch PH PVE source
        shell: pwsh
        run: |
          python merge_patch.py uess shimmy
          if ($LASTEXITCODE -ne 0) { throw 'PH PVE merge patch failed.' }

      - name: Validate current Unturned enum compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $legacy = Get-ChildItem -Path uess -Recurse -Filter *.cs |
            Select-String -SimpleMatch 'ERagdollEffect.NONE','ERagdollEffect.GOLD'
          if ($legacy) {
            $legacy | ForEach-Object { Write-Host $_.Path ':' $_.LineNumber ':' $_.Line }
            throw 'Legacy ERagdollEffect enum names remain after compatibility patch.'
          }

          $misc = Get-Content 'uess\src\Commands\MiscCommands.cs' -Raw
          if (-not $misc.Contains('ERagdollEffect.None')) {
            throw 'MiscCommands.cs was not updated to ERagdollEffect.None.'
          }

          Write-Host 'Current Unturned ERagdollEffect compatibility validated.'

      - name: Validate PluginState compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'uess\ShimmysMerged\PHSubsystemCompat.cs'
          if (-not (Test-Path $path)) { throw "Missing compatibility source: $path" }

          $src = Get-Content $path -Raw
          if (-not $src.Contains('using Rocket.API;')) {
            throw 'PHSubsystemCompat.cs is missing using Rocket.API; required for PluginState.'
          }
          if (-not $src.Contains('public PluginState State')) {
            throw 'PHSubsystemCompat.cs is missing the PluginState compatibility property.'
          }

          Write-Host 'Rocket.API PluginState compatibility validated.'

      - name: Validate PointTool hardening
        shell: pwsh
        run: |
          python -c "from pathlib import Path; checks={'uess/ShimmysMerged/Commands/PointToolCommand.cs':['PointTool failed to initialize your player session','PlayerSessionStore.Store == null'],'uess/ShimmysMerged/Modules/PointToolManager.cs':['Gesture ignored because session initialization failed','PlayerSessionStore.Store == null'],'uess/ShimmysMerged/AdminToolsPlugin.cs':['PlayerSessionStore.TryRegisterPlayer(player);']}; [( (_ for _ in ()).throw(AssertionError(f'Missing {term} in {path}')) if term not in Path(path).read_text(encoding='utf-8-sig') else None) for path,terms in checks.items() for term in terms]; print('PointTool hardening validated')"

      - name: Validate single Rocket plugin architecture
        shell: pwsh
        run: |
          python -c "from pathlib import Path; import re; root=Path('uess'); hits=[]; [(hits.append(str(p)) if m else None) for p in root.rglob('*.cs') if 'obj' not in p.parts and 'bin' not in p.parts for m in [re.search(r'class\s+\w+\s*:\s*RocketPlugin(?:<[^>]+>)?', p.read_text(encoding='utf-8-sig',errors='ignore'))]]; print('RocketPlugin implementations:', hits); assert len(hits)==1, f'Expected exactly 1 RocketPlugin implementation, found {len(hits)}'"

      - name: Precompile compatibility audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $allSource = Get-ChildItem -Path uess -Recurse -Filter *.cs |
            Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' }

          $forbidden = @(
            'ERagdollEffect.NONE',
            'ERagdollEffect.GOLD'
          )

          foreach ($term in $forbidden) {
            $hits = $allSource | Select-String -SimpleMatch $term
            if ($hits) {
              $hits | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line)" }
              throw "Legacy API token remains before compile: $term"
            }
          }

          $compat = Get-Content 'uess\ShimmysMerged\PHSubsystemCompat.cs' -Raw
          if (-not $compat.Contains('using Rocket.API;')) {
            throw 'PluginState namespace compatibility is missing.'
          }

          $ph = Get-Content 'uess\PHIntegration.cs' -Raw
          $requiredLocks = @(
            'asset.build == EBuild.BED',
            'drop.interactable is InteractableBed',
            'asset is ItemChargeAsset',
            'asset.build == EBuild.CHARGE',
            'trapAsset.isExplosive'
          )
          foreach ($term in $requiredLocks) {
            if (-not $ph.Contains($term)) {
              throw "Admin Editor hard-lock source missing: $term"
            }
          }

          Write-Host 'Precompile compatibility audit passed.'

      - name: Restore
        shell: pwsh
        working-directory: uess
        run: dotnet restore PHPVEEssentialPlugins.Build.csproj

      - name: Compile PHPVEEssentialPlugins.dll
        shell: pwsh
        working-directory: uess
        run: dotnet build PHPVEEssentialPlugins.Build.csproj --configuration Release --no-restore

      - name: Stage deployable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $dll = Get-ChildItem -Path uess\bin\Release -Recurse -Filter PHPVEEssentialPlugins.dll | Select-Object -First 1
          if ($null -eq $dll) { throw 'PHPVEEssentialPlugins.dll was not produced.' }
          Copy-Item $dll.FullName artifact\PHPVEEssentialPlugins.dll

          @'
          PH PVE ESSENTIAL PLUGINS - DEPLOYMENT

          Remove these old plugin DLLs from Rocket/Plugins when deploying this merged build:
          - uEssentials.dll
          - ShimmysAdminTools.dll
          - RocketTools.dll
          - RFRocketLibrary*.dll
          - CuffPlugin.dll
          - AppleAdminControl.dll

          KEEP AdvancedGodVanish.dll separate.

          Upload PHPVEEssentialPlugins.dll to Rocket/Plugins/ and restart.
          Rocket will generate PHPVEEssentialPlugins.configuration.xml and PHPVEEssentialPlugins.en.translation.xml.
          uEssentials data lives under PHPVEEssentialPlugins/Essentials and legacy data can be migrated automatically.

          /back cooldown is internal: 3600 seconds after SUCCESS only. Keep Rocket XML permission Cooldown=0.
          '@ | Set-Content artifact\DEPLOYMENT.txt -Encoding UTF8

          @'
          PH-SPECIFIC PERMISSIONS

          DEFAULT / ALL PLAYERS:
          <Permission Cooldown="0">phpve.tpa.respond</Permission>

          CEO:
          <Permission Cooldown="0">phpve.tpa.send</Permission>
          <Permission Cooldown="0">phpve.command.back</Permission>
          <Permission Cooldown="0">phpve.eagleeye.announce</Permission>
          <Permission Cooldown="0">admin.freecam</Permission>
          <Permission Cooldown="0">admin.editor</Permission>
          <Permission Cooldown="0">admin.spectate</Permission>

          ELITE:
          <Permission Cooldown="0">phpve.eagleeye.announce</Permission>
          <Permission Cooldown="0">admin.freecam</Permission>
          <Permission Cooldown="0">admin.editor</Permission>
          <Permission Cooldown="0">admin.spectate</Permission>

          MODERS:
          <Permission Cooldown="0">admin.freecam</Permission>
          <Permission Cooldown="0">admin.editor</Permission>
