          if ($LASTEXITCODE -ne 0) { throw 'Failed to materialize PH PVE source.' }

      - name: Fetch maintained source trees
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/TH3AL3X/uEssentials.git uess
          if ($LASTEXITCODE -ne 0) { throw 'Failed to clone maintained uEssentials.' }
          git clone --depth 1 https://github.com/ShimmyMySherbet/ShimmysAdminTools.git shimmy
          if ($LASTEXITCODE -ne 0) { throw 'Failed to clone ShimmysAdminTools.' }

      - name: Merge and patch PH PVE source
        shell: pwsh
        run: |
          python merge_patch.py uess shimmy
          if ($LASTEXITCODE -ne 0) { throw 'PH PVE merge patch failed.' }

      - name: Validate single Rocket plugin architecture
        shell: pwsh
        run: |
          python -c "from pathlib import Path; import re; root=Path('uess'); hits=[]; [(hits.append(str(p)) if m else None) for p in root.rglob('*.cs') if 'obj' not in p.parts and 'bin' not in p.parts for m in [re.search(r'class\s+\w+\s*:\s*RocketPlugin(?:<[^>]+>)?', p.read_text(encoding='utf-8-sig',errors='ignore'))]]; print('RocketPlugin implementations:', hits); assert len(hits)==1, f'Expected exactly 1 RocketPlugin implementation, found {len(hits)}'"

      - name: Restore
        shell: pwsh
        working-directory: uess
        run: dotnet restore PHPVEEssentialPlugins.Build.csproj

      - name: Compile PHPVEEssentialPlugins.dll
        shell: pwsh
        working-directory: uess
        run: dotnet build PHPVEEssentialPlugins.Build.csproj --configuration Release --no-restore

      - name: Stage deployable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $dll = Get-ChildItem -Path uess\bin\Release -Recurse -Filter PHPVEEssentialPlugins.dll | Select-Object -First 1
          if ($null -eq $dll) { throw 'PHPVEEssentialPlugins.dll was not produced.' }
          Copy-Item $dll.FullName artifact\PHPVEEssentialPlugins.dll

          @'
          PH PVE ESSENTIAL PLUGINS - DEPLOYMENT

          Remove these old plugin DLLs from Rocket/Plugins when deploying this merged build:
          - uEssentials.dll
          - ShimmysAdminTools.dll
          - RocketTools.dll
          - RFRocketLibrary*.dll
          - CuffPlugin.dll
          - AppleAdminControl.dll

          KEEP AdvancedGodVanish.dll separate.

          Upload PHPVEEssentialPlugins.dll to Rocket/Plugins/ and restart.
          Rocket will generate PHPVEEssentialPlugins.configuration.xml and PHPVEEssentialPlugins.en.translation.xml.
          uEssentials data lives under PHPVEEssentialPlugins/Essentials and legacy data can be migrated automatically.

          /back cooldown is internal: 3600 seconds after SUCCESS only. Keep Rocket XML permission Cooldown=0.
          '@ | Set-Content artifact\DEPLOYMENT.txt -Encoding UTF8

          @'
          PH-SPECIFIC PERMISSIONS

          DEFAULT / ALL PLAYERS:
          <Permission Cooldown="0">phpve.tpa.respond</Permission>

          CEO:
          <Permission Cooldown="0">phpve.tpa.send</Permission>
          <Permission Cooldown="0">phpve.command.back</Permission>
          <Permission Cooldown="0">phpve.eagleeye.announce</Permission>
          <Permission Cooldown="0">admin.freecam</Permission>
          <Permission Cooldown="0">admin.editor</Permission>
          <Permission Cooldown="0">admin.spectate</Permission>

          ELITE:
          <Permission Cooldown="0">phpve.eagleeye.announce</Permission>
          <Permission Cooldown="0">admin.freecam</Permission>
          <Permission Cooldown="0">admin.editor</Permission>
          <Permission Cooldown="0">admin.spectate</Permission>

          MODERS:
          <Permission Cooldown="0">admin.freecam</Permission>
          <Permission Cooldown="0">admin.editor</Permission>
          <Permission Cooldown="0">admin.spectate</Permission>

          STAFF / cleanup:
          <Permission Cooldown="0">admin.freecam</Permission>
          <Permission Cooldown="0">admin.editor</Permission>
          <Permission Cooldown="0">admin.spectate</Permission>
          <Permission Cooldown="0">admin.editor.otherobjects</Permission>

          CUFF:
          <Permission Cooldown="0">phpve.command.cuff</Permission>
          <Permission Cooldown="0">phpve.command.uncuff</Permission>
          Legacy playerCuff/playerUncuff are also accepted.

          ROCKET PERMISSION ADMIN:
          <Permission Cooldown="0">rocketpermission</Permission>
          '@ | Set-Content artifact\PH-SPECIFIC-PERMISSIONS.txt -Encoding UTF8

          Copy-Item PHAdditions.cs artifact\PHIntegration.source.cs
          Copy-Item merge_patch.py artifact\merge_patch.py
          Copy-Item uess\LICENSE artifact\LICENSE-uEssentials-GPLv2 -ErrorAction SilentlyContinue

      - name: Upload merged plugin
        uses: actions/upload-artifact@v4
        with:
          name: PH-PVE-Essential-Plugins-Merged
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
