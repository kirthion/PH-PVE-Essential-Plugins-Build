name: Build Excelsior120 HUD v1.21.0 SIMPLE-AIRCRAFT SYSTEMS

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-excelsior120-hud-v27.2-aircraft-systems.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Materialize source
        shell: pwsh
        run: |
          $b64 = ''
          [IO.File]::WriteAllBytes("Excelsior120-HUD-Source-v1.21.0-SIMPLE-AIRCRAFT-SYSTEMS.zip", [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash "Excelsior120-HUD-Source-v1.21.0-SIMPLE-AIRCRAFT-SYSTEMS.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "e0cb78316b67e05254c7e8be4c28f14d3a930adb5f11511a587de4266ae5d87c"
          if ($actual -ne $expected) { throw "Embedded source ZIP hash mismatch: $actual != $expected" }
          Expand-Archive -LiteralPath "Excelsior120-HUD-Source-v1.21.0-SIMPLE-AIRCRAFT-SYSTEMS.zip" -DestinationPath "hudsrc" -Force
      - name: Restore
        shell: pwsh
        run: dotnet restore "hudsrc/PHPVESurvivalHUD/PHPVESurvivalHUD.csproj"
      - name: Build
        shell: pwsh
        run: dotnet build "hudsrc/PHPVESurvivalHUD/PHPVESurvivalHUD.csproj" -c Release --no-restore
      - name: Stage deploy package
        shell: pwsh
        run: |
          $stage = "stage/Rocket/Plugins"
          New-Item -ItemType Directory -Force -Path "$stage/PHPVESurvivalHUD" | Out-Null
          Copy-Item "hudsrc/PHPVESurvivalHUD/bin/Release/netstandard2.1/PHPVESurvivalHUD.dll" "$stage/PHPVESurvivalHUD.dll" -Force
          Copy-Item "hudsrc/PHPVESurvivalHUD/deploy/Rocket/Plugins/PHPVESurvivalHUD/PHPVESurvivalHUD.configuration.xml" "$stage/PHPVESurvivalHUD/PHPVESurvivalHUD.configuration.xml" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Excelsior120-HUD-v1.21.0-SIMPLE-AIRCRAFT-SYSTEMS
          path: stage
          if-no-files-found: error
