name: Build Excelsior120 HUD v1.16.1 FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-excelsior120-hud-v23-1-final.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Materialize Excelsior120 HUD v1.16.1 FINAL source
        shell: pwsh
        run: |
          $b64 = ''
          [IO.File]::WriteAllBytes("Excelsior120-HUD-Source-v1.16.1-FINAL.zip", [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash "Excelsior120-HUD-Source-v1.16.1-FINAL.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "2d92ac1e0f8bc797d87b2bddea74cd00f468c0f8e2f84e931dda19ff8898c9b5"
          if ($actual -ne $expected) { throw "Embedded source ZIP hash mismatch: $actual != $expected" }
          Expand-Archive -LiteralPath "Excelsior120-HUD-Source-v1.16.1-FINAL.zip" -DestinationPath "hudsrc" -Force
          Get-ChildItem -Recurse hudsrc | Select-Object FullName

      - name: Restore
        shell: pwsh
        run: dotnet restore "hudsrc/PHPVESurvivalHUD/PHPVESurvivalHUD.csproj"

      - name: Build
        shell: pwsh
        run: dotnet build "hudsrc/PHPVESurvivalHUD/PHPVESurvivalHUD.csproj" -c Release --no-restore

      - name: Stage deploy package
        shell: pwsh
        run: |
          $stage = "stage/Rocket/Plugins"
          New-Item -ItemType Directory -Force -Path "$stage/PHPVESurvivalHUD" | Out-Null
          Copy-Item "hudsrc/PHPVESurvivalHUD/bin/Release/netstandard2.1/PHPVESurvivalHUD.dll" "$stage/PHPVESurvivalHUD.dll" -Force
          Copy-Item "hudsrc/PHPVESurvivalHUD/deploy/Rocket/Plugins/PHPVESurvivalHUD/PHPVESurvivalHUD.configuration.xml" "$stage/PHPVESurvivalHUD/PHPVESurvivalHUD.configuration.xml" -Force
          Get-FileHash "$stage/PHPVESurvivalHUD.dll" -Algorithm SHA256
          Get-ChildItem -Recurse stage | Select-Object FullName,Length

      - uses: actions/upload-artifact@v4
        with:
          name: Excelsior120-HUD-v1.16.1-FINAL
          path: stage
          if-no-files-found: error
