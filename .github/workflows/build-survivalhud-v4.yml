name: Build PH PVE Survival HUD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-survivalhud*.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Materialize Survival HUD source
        shell: pwsh
        run: |
          $b64 = ''
          [IO.File]::WriteAllBytes('hud.zip', [Convert]::FromBase64String($b64))
          Expand-Archive -Path hud.zip -DestinationPath buildsrc -Force
      - name: Restore
        run: dotnet restore buildsrc/PHPVESurvivalHUD/PHPVESurvivalHUD.csproj
      - name: Build
        run: dotnet build buildsrc/PHPVESurvivalHUD/PHPVESurvivalHUD.csproj -c Release --no-restore -o artifact
      - name: Stage deploy package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\Rocket\Plugins\PHPVESurvivalHUD | Out-Null
          Copy-Item artifact\PHPVESurvivalHUD.dll package\Rocket\Plugins\PHPVESurvivalHUD.dll
          Copy-Item buildsrc\PHPVESurvivalHUD\deploy\Rocket\Plugins\PHPVESurvivalHUD\PHPVESurvivalHUD.configuration.xml package\Rocket\Plugins\PHPVESurvivalHUD\PHPVESurvivalHUD.configuration.xml
      - uses: actions/upload-artifact@v4
        with:
          name: PHPVESurvivalHUD
          path: package
          retention-days: 30
